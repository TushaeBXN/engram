name: Publish to PyPI

# Publishes engram-chateau when a GitHub release is published.
# Uses PyPI trusted publishing (OIDC): no API token is stored in the repo.
# One-time setup on pypi.org: see "Releasing" in the README.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the release tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          mod=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('engram/__init__.py').read()).group(1))")
          echo "tag=$tag pyproject=$pkg engram.__version__=$mod"
          if [ "$tag" != "$pkg" ] || [ "$pkg" != "$mod" ]; then
            echo "::error::Release tag v$tag must match pyproject.toml ($pkg) and engram/__init__.py ($mod)"
            exit 1
          fi
      - name: Run tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest -q
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/engram-chateau/
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
