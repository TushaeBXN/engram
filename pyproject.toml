[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name ("engram" on PyPI is an unrelated project).
# The command, import name and project are all still "engram".
name = "engram-chateau"
version = "1.10.1"
description = "Small, private, verbatim AI memory: local MCP server, Claude Code hooks and semantic search."
authors = [{name = "Tushae Thomas"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
readme = "README.md"
keywords = ["ai", "memory", "mcp", "llm", "chromadb", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # ChromaDB needs onnxruntime, which has no build for Python 3.15 yet. There
    # Engram installs without it and uses the built-in sqlitevec backend; the
    # >=1.0 floor stops pip backtracking into old ChromaDB releases that fail.
    'chromadb>=1.0.0; python_version < "3.15"',
    "pyyaml>=6.0",
    "watchdog>=3.0.0",
    "questionary>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
chromadb = ["chromadb>=1.0.0"]
faiss = ["faiss-cpu>=1.7.0"]
sqlitevec = ["sqlite-vec>=0.1.0"]
viz = ["matplotlib>=3.5.0", "networkx>=2.8.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
]
all = ["faiss-cpu>=1.7.0", "sqlite-vec>=0.1.0", "matplotlib>=3.5.0", "networkx>=2.8.0"]

[project.scripts]
engram = "engram.cli:app"
engram-mcp = "engram.mcp_server:run_server"
engram-recall = "engram.recall:main"
engram-chateau = "engram.mcp_server:run_server"   # what MCP registry clients run (`uvx engram-chateau`)

[project.urls]
Repository = "https://github.com/TushaeBXN/engram"
Issues = "https://github.com/TushaeBXN/engram/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["engram*"]

[tool.setuptools.package-data]
engram = ["ui.html", "hooks/*.sh"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# UP045 rewrites Optional[X] as X | None. Typer evaluates CLI annotations at
# runtime, where that syntax fails on Python 3.9, so keep Optional while 3.9
# is supported.
ignore = ["E501", "UP045"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["engram"]
omit = ["tests/*", "benchmarks/*", "examples/*"]
